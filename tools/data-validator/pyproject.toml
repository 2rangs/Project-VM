[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-data-validator"
version = "0.1.0"
description = "PROJECT V — validates normalized/synthetic datasets against the JSON Schemas and enforces the real/synthetic separation rule."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pv-validate = "pv_data_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
