[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-round-value"
version = "0.1.0"
description = "PROJECT V — pre-round round-value model (LightGBM + baselines), ONNX export. Pre-round features only; leakage-guarded (README §26.3-26.4)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.15", "onnxmltools>=1.12", "skl2onnx>=1.16", "onnxruntime>=1.17"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
