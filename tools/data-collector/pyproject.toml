[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pv-data-collector"
version = "0.1.0"
description = "PROJECT V — ETL that verifies/normalizes real VCT data (VCT Reference DuckDB) and generates clearly-separated synthetic Ascent decision data."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # duckdb is only needed for the real VCT Reference normalizer; the synthetic
  # generators and CLI run on the stdlib alone.
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
pv-data = "pv_data_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
