<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- PixiJS needs eval (shader gen) and blob workers; allowed only in this
         sandboxed, contextIsolated renderer loading local content. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://media.valorant-api.com data: blob:; media-src 'self' blob:; connect-src 'self' https://valorant-api.com https://media.valorant-api.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:" />
    <title>PROJECT V — Desktop</title>
  </head>
  <body>
    <!-- App-start splash: plain HTML/CSS so it shows before any script runs; React replaces it on
         mount. If the app never mounts, a help line fades in after 12 s instead of spinning forever. -->
    <style>
      #pv-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #0f1923; color: #ece8e1; font-family: "DIN Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
      #pv-splash div { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
      #pv-splash b { font-size: 30px; letter-spacing: .12em; }
      #pv-splash span { font-size: 13px; letter-spacing: .16em; color: #7e8a94; }
      #pv-splash span i { font-style: normal; color: #ff4655; }
      #pv-splash u { display: block; width: 220px; height: 4px; background: #ffffff1c; overflow: hidden; transform: skewX(-18deg); text-decoration: none; }
      #pv-splash u::after { content: ""; display: block; width: 32%; height: 100%; background: #ece8e1; animation: pv-splash-slide 1.3s ease-in-out infinite; }
      #pv-splash em { font-style: normal; font-size: 12px; color: #ffd0d4; opacity: 0; animation: pv-splash-late .4s linear 12s forwards; }
      @keyframes pv-splash-slide { from { margin-left: -32%; } to { margin-left: 100%; } }
      @keyframes pv-splash-late { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #pv-splash u::after { animation: none; width: 100%; opacity: .4; } }
    </style>
    <div id="root">
      <div id="pv-splash" role="status" data-testid="app-splash">
        <div>
          <b>PROJECT V</b>
          <span><i>//</i> 불러오는 중 · LOADING</span>
          <u></u>
          <em>시작이 지연되고 있습니다. 앱을 다시 실행해 주세요. · Startup is taking too long — please restart the app.</em>
        </div>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
